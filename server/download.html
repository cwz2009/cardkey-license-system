<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Cpath%20fill%3D%27%234d7cf6%27%20d%3D%27M12%202l8%204v6c0%205-3.5%208-8%2010-4.5-2-8-5-8-10V6z%27/%3E%3Cpath%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%272.2%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20d%3D%27M9.2%2012.4l2%202%204.4-4.8%27/%3E%3C/svg%3E">
<meta name="theme-color" content="#0f1115">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>新版本下载</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e8e8e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .card{background:#1a1d24;border:1px solid #2a2e38;border-radius:16px;padding:32px 24px;width:100%;max-width:420px}
  .icon{font-size:52px;margin-bottom:12px}
  h1{font-size:20px;margin-bottom:8px;color:#fff}
  .ver{color:#4d7cf6;font-weight:600;margin-bottom:16px;font-size:14px}
  .desc{color:#9aa0ac;font-size:13px;line-height:1.7;margin-bottom:24px}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:12px}
  .btn-primary{background:#4d7cf6;color:#fff}
  .btn-ghost{background:#232733;color:#c6cbd4;border:1px solid #323846}
  .hint{color:#6b7280;font-size:12px;line-height:1.6;margin-top:8px}
  .err{color:#f87171;font-size:12px;margin-top:12px;display:none;word-break:break-all}
  .link{color:#4d7cf6;word-break:break-all;font-size:11px;margin-top:8px;display:none}

/* —— 全站统一打磨（2026-08-11）：聚焦环 / 选中色 / 配色模式 / 减弱动效 / 悬停反馈 —— */
:root{color-scheme:dark}
[data-theme="light"]{color-scheme:light}
::selection{background:rgba(77,124,246,.32);color:inherit}
:focus-visible{outline:2px solid var(--acc,#4d7cf6);outline-offset:2px}
button,input,textarea,select{font-family:inherit}
button.act:hover,button:hover,.btn-primary:hover{filter:brightness(1.08)}
button:active,.btn:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.card{animation:cardIn .45s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#4d7cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 19h16"/></svg></div>
  <h1>发现新版本</h1>
  <div class="ver" id="ver">正在检测…</div>
  <div class="desc" id="desc">点击下方按钮下载最新安装包（.apk），下载完成后直接点击安装即可。<br><small style="opacity:.7">若提示"未知来源"，请在设置→安全中允许安装未知应用。</small></div>
  <button class="btn btn-primary" id="dl">点击下载</button>
  <button class="btn btn-ghost" id="copy">复制下载链接</button>
  <div class="hint">提示：如果点击下载没有反应，请复制链接到手机浏览器打开下载。</div>
  <div class="err" id="err"></div>
  <div class="link" id="link"></div>
</div>
<script>
(function(){
  var API = "index.php";
  var url = "";
  function q(p){ return new Promise(function(res){ fetch(API + p).then(function(r){ return r.json(); }).then(res).catch(function(){ res({}); }); }); }
  q("?action=version_check&v=0").then(function(r){
    var el = document.getElementById("ver");
    if(r && r.ok){
      el.textContent = "最新版本：V" + (r.latest || "11") + (r.gate_min_ver ? " · 已停止旧版" : "");
      url = r.url || "";
      if(!url){ document.getElementById("err").style.display = "block"; document.getElementById("err").textContent = "获取下载地址失败，请联系管理端。"; }
    } else {
      el.textContent = "获取版本信息失败";
    }
  });
  document.getElementById("dl").onclick = function(){
    if(!url){ document.getElementById("err").style.display = "block"; document.getElementById("err").textContent = "暂无下载地址"; return; }
    try{ window.location.href = url; }catch(e){}
  };
  document.getElementById("copy").onclick = function(){
    if(!url){ document.getElementById("err").style.display = "block"; document.getElementById("err").textContent = "暂无下载地址"; return; }
    var done = function(){ document.getElementById("copy").textContent = "✅ 已复制"; setTimeout(function(){ document.getElementById("copy").textContent = "📋 复制下载链接"; }, 2000); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(function(){ fallbackCopy(); }); }
    else fallbackCopy();
    function fallbackCopy(){
      var ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ document.getElementById("link").style.display = "block"; document.getElementById("link").textContent = url; }
      document.body.removeChild(ta);
    }
  };
})();
</script>
</body>
</html>
